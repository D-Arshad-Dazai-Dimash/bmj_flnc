name: Trigger Vercel Frontend Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-vercel.yml"
  workflow_dispatch:

concurrency:
  group: vercel-frontend-production
  cancel-in-progress: true

jobs:
  trigger-vercel-deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

    steps:
      - name: Check deploy hook secret
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "Secret VERCEL_DEPLOY_HOOK_URL is missing. Skipping Vercel trigger."
          else
            echo "Secret VERCEL_DEPLOY_HOOK_URL found."
          fi

      - name: Trigger Vercel Deploy Hook
        if: env.VERCEL_DEPLOY_HOOK_URL != ''
        run: |
          curl --fail --show-error --silent -X POST "$VERCEL_DEPLOY_HOOK_URL"
