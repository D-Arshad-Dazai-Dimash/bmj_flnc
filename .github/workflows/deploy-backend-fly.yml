name: Deploy Backend to Fly

on:
  push:
    branches: ["main"]
    paths:
      - "backend/Barnamaj.API/**"
      - ".github/workflows/deploy-backend-fly.yml"
  workflow_dispatch:

concurrency:
  group: fly-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy API
        run: flyctl deploy --remote-only --config backend/Barnamaj.API/fly.toml

      - name: Verify health
        run: curl --fail --retry 10 --retry-delay 5 --retry-connrefused https://barnamaj-api.fly.dev/api/health/live
